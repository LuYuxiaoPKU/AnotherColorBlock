plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.116'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
    version = project.neoforge_version
}

// NeoGradle 7 runs（moddev 2.x 之前 1.20.4 时代官方工具链，MDK 实证）
runs {
    configureEach {
        systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        modSource project.sourceSets.main
    }
    client {
    }
    server {
        programArgument '--nogui'
    }
    gameTestServer {
        systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
    compileOnly "org.bytedeco:javacv:1.5.11"

    // common 源码直接并入本模块编译（两端同为官方映射，无需转换）
    compileOnly(project(':common'))
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}
