plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// 1.20.1 = Forge 47 体系（NeoForge 20.1 沿用 Forge userdev，非新网络工具链）
legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    // Default run configurations
    runs {
        configureEach {
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        client {
        }
        server {
            programArgument '--nogui'
        }
        gameTestServer {
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly "org.bytedeco:javacv:1.5.11"

    // common 源码直接并入本模块编译（两端同为官方映射，无需转换）
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Forge 47 体系（1.20.1）的 mixin 声明走 MANIFEST MixinConfigs 属性——
// FML 47.2.2 不解析 mods.toml 的 [[mixins]] 块（该特性 FML 2.0/1.20.2+ 才有）
tasks.named('jar', Jar) {
    manifest {
        attributes('MixinConfigs': 'particleex.mixins.json')
    }
}

java {
    withSourcesJar()
}