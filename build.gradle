plugins {
    id 'fabric-loom' version '1.13.6' apply false
    // net.neoforged.moddev 在 neoforge 模块内声明（依赖 maven.neoforged.net，网络恢复后启用）
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        // sponge-mixin 等 fabric 生态依赖
        maven { url 'https://maven.fabricmc.net/' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(17)
        it.options.compilerArgs += ['--enable-preview']
    }

    tasks.withType(ProcessResources).configureEach {
        it.setFilteringCharset('UTF-8')
    }

    tasks.withType(Test).configureEach {
        // CodeGen 以 --enable-preview 编译（switch patterns），测试 JVM 需同步开启
        it.jvmArgs('--enable-preview')
    }
}
