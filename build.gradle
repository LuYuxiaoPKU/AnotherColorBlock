plugins {
    // loom 1.17.20 + 新插件 id net.fabricmc.fabric-loom（fabric-api 26.x 线上同款）：
// 26.x = 无混淆版本（Mojang 直接发布可读名 jar，loom 1.14 起支持），走无混淆路径
// 无需 intermediary/mappings 配置；mixin 注解直出 official，运行时不依赖 loader remap
// （旧 id fabric-loom 走混淆 remap 路径，26.x 上强制要求 mappings 且注解中转 intermediary，
//  在无官方映射下断链——客户端崩溃 + CI 报 "Configuration 'mappings' has no dependencies"）
id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
    // net.neoforged.moddev 在 neoforge 模块内声明（依赖 maven.neoforged.net，网络恢复后启用）
}

// MC 26.x 起要求 Java 25，其余版本用 Java 21
def requiredJava = providers.gradleProperty('minecraft_version').get().startsWith('26') ? 25 : 21

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(requiredJava)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(requiredJava)
    }

    tasks.withType(ProcessResources).configureEach {
        it.setFilteringCharset('UTF-8')
    }
}

// SNAPSHOT 依赖（loom 1.18-SNAPSHOT 等）不缓存：每次构建拉最新
configurations.all {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}
