plugins {
    id 'fabric-loom' version '1.13.6' apply false
    // net.neoforged.moddev 在 neoforge 模块内声明（依赖 maven.neoforged.net，网络恢复后启用）
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        // sponge-mixin 等 fabric 生态依赖
        maven { url 'https://maven.fabricmc.net/' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(8)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        // Java 8 目标：--release 8 与 loom 的 JDK 21 运行时 javac 冲突（invalid flag），用 compat 双设
        it.sourceCompatibility = '1.8'
        it.targetCompatibility = '1.8'
    }

    tasks.withType(ProcessResources).configureEach {
        it.setFilteringCharset('UTF-8')
    }

}
