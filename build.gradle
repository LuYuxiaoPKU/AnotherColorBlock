plugins {
    // loom 1.17.20（fabric-api 26.x 线上同款）：loom 1.17 内置 26.x 支持，
    // 默认映射 = RelativityMC modern-yarn，mixin 注解直出 official（可读名），
    // 运行时不依赖 loader remap（loom 1.18 的 intermediary 中转在 26.x 断链）
    id 'fabric-loom' version '1.17.20' apply false
    // net.neoforged.moddev 在 neoforge 模块内声明（依赖 maven.neoforged.net，网络恢复后启用）
}

// MC 26.x 起要求 Java 25，其余版本用 Java 21
def requiredJava = providers.gradleProperty('minecraft_version').get().startsWith('26') ? 25 : 21

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(requiredJava)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(requiredJava)
    }

    tasks.withType(ProcessResources).configureEach {
        it.setFilteringCharset('UTF-8')
    }
}

// SNAPSHOT 依赖（loom 1.18-SNAPSHOT 等）不缓存：每次构建拉最新
configurations.all {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}
