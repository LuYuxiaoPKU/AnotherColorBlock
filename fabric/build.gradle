plugins {
    id 'java-library'
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"

    // common 源码直接并入本模块编译（loom 统一映射到 Yarn）
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

loom {
    // 26.x 无官方 mojmap：intermediary 由 RelativityMC 维护（CodeMC 镜像）。
    // 设置 intermediaryUrl 使 loom 用 CodeMC 的 26.x intermediary（官方渠道止于 1.21.11），
    // dev 命名空间保持官方可读名（26.x 生态 fabric-api 亦以官方名发布）
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    // 显式关掉 intermediate dev 映射（loom 默认值可能为 true，需与 CI 行为一致）
    useIntermediateMappings = false
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// 26.x 生态缺陷绕过（客户端 Mixin apply 崩溃修复）：
// loom 1.18 的 remapJar 把 mixin 注解字符串 remap 到 intermediary（class_XXXX），
// 期望 loader 运行时 static remap 转回 official；但 26.x 无官方 mojmap，
// loader 没有 intermediary→official 映射数据 → 注解停留中间名 → 客户端
// @Shadow/@Inject 签名不匹配崩溃（No refMap loaded）。
// 对策：与 fabric-api 构建链一致，loom 降级 1.16.2 —— mixin AP 在 javac 阶段
// 直出 dev 命名空间（official 可读名），jar 内注解即官方名，运行时不依赖 remap。
// 实证：fabric-particles-v1（26.x，loom 1.16.2 构建）注解 = 全可读名，无
// Fabric-Loom-Mixin-Remap-Type 键；1.18 产物 = class_XXXX；两次实机复测确认
// loader static remap 落空（manifest 声明 intermediary 亦无效）。

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    // 在 fabric.mod.json 中展开 ${minecraft_version}，避免依赖版本写死
    filesMatching('fabric.mod.json') {
        expand 'minecraft_version': project.minecraft_version, 'version': project.version
    }
}

repositories {
    // modern-yarn（26.x 映射）的公开镜像：CodeMC 托管 RelativityMC 制品
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
        }
        filter { includeGroup 'org.relativitymc' }
    }
}
