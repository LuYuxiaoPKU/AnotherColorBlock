plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 无混淆路径（net.fabricmc.fabric-loom）：无 modImplementation 扩展，
    // 照 fabric-api 用普通依赖（loader=api 编译期，fabric-api=运行时）
    api "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 26.x 映射全部走 loom 1.17 无混淆路径默认（26.x = non-obfuscated Minecraft，
    // Mojang 直发可读名 jar）：零自定义映射配置（fabric-api 26.x 线上同款）。
    // 曾经的显式 modern-yarn/intermediaryUrl 会破坏映射链（CI 实证 'Mappings src
    // namespace must match remap src namespace, expected official but got intermediary'）。

    // common 源码直接并入本模块编译（loom 统一映射到 Yarn）
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

loom {
    // 26.x 无官方 mojmap：intermediary 由 RelativityMC 维护（CodeMC 镜像）。
    // 设置 intermediaryUrl 使 loom 用 CodeMC 的 26.x intermediary（官方渠道止于 1.21.11），
    // dev 命名空间保持官方可读名（26.x 生态 fabric-api 亦以官方名发布）
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    // 显式关掉 intermediate dev 映射（loom 默认值可能为 true，需与 CI 行为一致）
    useIntermediateMappings = false
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    // 在 fabric.mod.json 中展开 ${minecraft_version}，避免依赖版本写死
    filesMatching('fabric.mod.json') {
        expand 'minecraft_version': project.minecraft_version, 'version': project.version
    }
}

repositories {
    // modern-yarn（26.x 映射）的公开镜像：CodeMC 托管 RelativityMC 制品
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
        }
        filter { includeGroup 'org.relativitymc' }
    }
}

// 26.x 生态缺陷绕过（客户端 Mixin apply 崩溃修复）：
// loom 1.18 的 remapJar 把 mixin 注解字符串 remap 到 intermediary（class_XXXX），
// 期望 loader 运行时 static remap 转回 official；但 26.x 无官方 mojmap，
// loader 没有 intermediary→official 映射数据 → 注解停留中间名 → 客户端
// @Shadow/@Inject 签名不匹配崩溃（No refMap loaded）。
// 对策：loom 1.17.20 + 无混淆插件（fabric-api 26.x 线上同款）——mixin AP 在
// javac 阶段直出 official 可读名，jar 内注解即官方名，运行时不依赖 remap。
// 实证：fabric-api 0.162.0+26.3 发布物 = loom 1.17.20 / Mapping-Namespace: official /
// 无 Fabric-Loom-Mixin-Remap-Type 键；两次实机复测确认 manifest 声明 intermediary
// 的 workaround 无效（loader 无 intermediary→official 映射可查），予以移除。
