plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 26.x 映射全部走 loom 1.17 默认（RelativityMC modern-yarn）：
    // fabric-api 26.x 构建链零自定义映射配置（实证：其 loom.gradle 无 mappings/intermediaryUrl），
    // 显式配置 modern-yarn/intermediaryUrl 会破坏映射链（CI 实证 "Mappings src namespace
    // must match remap src namespace, expected official but got intermediary"）。

    // common 源码直接并入本模块编译（loom 统一映射到 Yarn）
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// 26.x 生态缺陷绕过（客户端 Mixin apply 崩溃修复）：
// loom 1.18 的 remapJar 把 mixin 注解字符串 remap 到 intermediary（class_XXXX），
// 期望 loader 运行时 static remap 转回 official；但 26.x 无官方 mojmap，
// loader 没有 intermediary→official 映射数据 → 注解停留中间名 → 客户端
// @Shadow/@Inject 签名不匹配崩溃（No refMap loaded）。
// 对策：loom 1.17.20（fabric-api 26.x 线上同款）——mixin AP 在 javac 阶段
// 直出 dev 命名空间（official 可读名），jar 内注解即官方名，运行时不依赖 remap。
// 实证：fabric-api 26.x 构建链零自定义映射配置（loom.gradle 无 mappings/
// intermediaryUrl，仅 maven.fabricmc.net 仓库）；其产物注解全可读名、无
// Fabric-Loom-Mixin-Remap-Type 键；1.18 产物 = class_XXXX；两次实机复测确认
// loader static remap 落空（manifest 声明 intermediary 亦无效）。

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    // 在 fabric.mod.json 中展开 ${minecraft_version}，避免依赖版本写死
    filesMatching('fabric.mod.json') {
        expand 'minecraft_version': project.minecraft_version, 'version': project.version
    }
}
