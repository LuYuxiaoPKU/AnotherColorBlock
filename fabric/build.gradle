plugins {
    id 'java-library'
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    // common 源码直接并入本模块编译（loom 统一映射到 Yarn）
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

loom {
    // 26.x 无官方 mojmap：intermediary 由 RelativityMC 维护（CodeMC 镜像）。
    // 设置 intermediaryUrl 使 loom 用 CodeMC 的 26.x intermediary（官方渠道止于 1.21.11），
    // dev 命名空间保持官方可读名（26.x 生态 fabric-api 亦以官方名发布）
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    // 显式关掉 intermediate dev 映射（loom 默认值可能为 true，需与 CI 行为一致）
    useIntermediateMappings = false
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    // 在 fabric.mod.json 中展开 ${minecraft_version}，避免依赖版本写死
    filesMatching('fabric.mod.json') {
        expand 'minecraft_version': project.minecraft_version, 'version': project.version
    }
}

repositories {
    // modern-yarn（26.x 映射）的公开镜像：CodeMC 托管 RelativityMC 制品
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
        }
        filter { includeGroup 'org.relativitymc' }
    }
}

// 26.x 生态缺陷绕过（客户端 Mixin apply 崩溃修复）：
// loom 1.18 的 remapJar 把 mixin 注解字符串 remap 到 intermediary（class_XXXX），
// 但 26.x 运行时命名空间 = official（可读名），且 jar 标注 official 时 loader 的
// static remap（Fabric-Loom-Mixin-Remap-Type: static）不会触发 → 注解字符串停留
// intermediary → 客户端 @Shadow/@Inject 签名不匹配崩溃（No refMap loaded）。
// 对策：发布 jar 的 manifest 声明为 intermediary，触发 loader 运行时 remap——
// 字节码已是 official（映射无匹配项时 tinyremapper 原样保留，不受影响），
// mixin 注解的 class_XXXX 被映射到 official → 客户端正常。
tasks.named('remapJar') {
    doLast {
        def src = remapJar.archiveFile.get().asFile
        def tmp = new File(src.parentFile, src.name + '.tmp')
        def zin = new java.util.zip.ZipInputStream(new FileInputStream(src))
        def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
        def buf = new byte[8192]
        def entry
        while ((entry = zin.nextEntry) != null) {
            zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
            if (entry.name == 'META-INF/MANIFEST.MF') {
                def text = new String(zin.readAllBytes(), 'UTF-8')
                        .replace('Fabric-Mapping-Namespace: official', 'Fabric-Mapping-Namespace: intermediary')
                zout.write(text.getBytes('UTF-8'))
            } else {
                int n
                while ((n = zin.read(buf)) > 0) zout.write(buf, 0, n)
            }
            zout.closeEntry()
        }
        zout.close()
        zin.close()
        src.delete()
        tmp.renameTo(src)
        println 'remapJar: manifest 已声明为 intermediary（26.x mixin 绕过）'
    }
}
