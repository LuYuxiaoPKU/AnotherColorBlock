plugins {
    id 'java-library'
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    // common 源码直接并入本模块编译（loom 统一映射到 Yarn）
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

loom {
    // devLocal 仅在本机用户级 ~/.gradle/gradle.properties 设置（CI 不读用户级，保持默认路径）
    // 26.x 无官方 mojmap：SourceRemapper 需要 tiny tree 含 official 段，只能靠 RelativityMC
    // intermediary（official→intermediary）提供；代价是 dev classpath 变 intermediary 命名空间
    def devLocal = providers.gradleProperty('devLocal').present
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    useIntermediateMappings = devLocal
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    // 在 fabric.mod.json 中展开 ${minecraft_version}，避免依赖版本写死
    filesMatching('fabric.mod.json') {
        expand 'minecraft_version': project.minecraft_version, 'version': project.version
    }
}

repositories {
    // modern-yarn（26.x 映射）的公开镜像：CodeMC 托管 RelativityMC 制品
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
        }
        filter { includeGroup 'org.relativitymc' }
    }
}
