name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dump neoforge metadata（临时探测 1.20.1 可用 neoforge 版本）
        run: curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep '^20\.1' | sort -V | tail -5 || true

      - name: 构建 ${{ matrix.module }} 模块
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: particleex-${{ matrix.module }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error