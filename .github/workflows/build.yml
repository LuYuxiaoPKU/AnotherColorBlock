name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dump neoforge/neoform metadata(temporary)
        if: ${{ always() }}
        run: |
          echo '---NEOFORGE---'
          curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '<version>[^<]*</version>' | grep -E '^<version>21.(3|5)' | sed 's/<[^>]*>//g' | sort -V | tail -10 || true; echo '---NEOFORM-1.21-full---'; curl -s https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml | grep -oE '<version>1.21-[^<]*</version>' | sed 's/<[^>]*>//g' | grep -vE 'pre|rc' | sort -V | tail -5 || true; echo '---NEOFORM-others---'; curl -s https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml | grep -oE '<version>1.21.(3|5|7|9)-[^<]*</version>' | sed 's/<[^>]*>//g' | grep -vE 'pre|rc' | sort -V | tail -8 || true
          echo '---NEOFORM---'
          curl -s https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml | grep -oE '<version>1.21-[^<]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -5 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 表达式引擎单元测试（common）
        run: ./gradlew :common:test --stacktrace

      - name: 构建 ${{ matrix.module }} 模块
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: particleex-${{ matrix.module }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error