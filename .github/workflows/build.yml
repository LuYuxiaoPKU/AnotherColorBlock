name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-universal:
    runs-on: ubuntu-latest
    steps:
      - name: 查 universal jar 与 pom 依赖（临时探针）
        run: |
          for f in neoforge-20.5.21-beta-universal.jar neoforge-20.5.21-beta-client.jar; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://maven.neoforged.net/releases/net/neoforged/neoforge/20.5.21-beta/$f")
            echo "$f: $code"
          done
          echo "=== pom 依赖段:"
          curl -s --max-time 20 "https://maven.neoforged.net/releases/net/neoforged/neoforge/20.5.21-beta/neoforge-20.5.21-beta.pom" | sed -n '/<dependencies>/,/<\/dependencies>/p' | head -40

  build:
    strategy:
      fail-fast: false
      matrix:
        # 1.20.5 线 fabric-only（NeoForge 1.20.5 仅 beta，maven 无主 jar，moddev 不可构建）
        module: [ fabric ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 表达式引擎单元测试（common）
        run: ./gradlew :common:test --stacktrace

      - name: 构建 ${{ matrix.module }} 模块
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: particleex-${{ matrix.module }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error