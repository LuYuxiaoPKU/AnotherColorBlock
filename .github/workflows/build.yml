name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-neoforge-versions:
    runs-on: ubuntu-latest
    steps:
      - name: 实证 neoforge / neoform 版本（临时探针）
        run: |
          echo "=== neoforge 20.5.x:"
          curl -s --max-time 30 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '<version>20\.5\.[^<]*</version>' | tail -5
          echo "=== neoform 1.20.5:"
          curl -s --max-time 30 https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml | grep -oE '<version>1\.20\.5-[^<]*</version>' | tail -5

  build:
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 表达式引擎单元测试（common）
        run: ./gradlew :common:test --stacktrace

      - name: 构建 ${{ matrix.module }} 模块
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: particleex-${{ matrix.module }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error