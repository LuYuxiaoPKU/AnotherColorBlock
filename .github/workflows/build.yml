name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 MC 版本（决定 JDK）
        id: mcver
        run: echo "version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(steps.mcver.outputs.version, '26') && '25' || '21' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 表达式引擎单元测试（common）
        run: ./gradlew :common:test --stacktrace

      - name: 构建 ${{ matrix.module }} 模块
        run: ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: particleex-${{ matrix.module }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error